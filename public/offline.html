<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Polarch — offline</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#F7F6F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181615" media="(prefers-color-scheme: dark)" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f4;
        --fg: #22201e;
        --muted: #67615c;
        --card: #ffffff;
        --line: #e3e0dc;
        --primary: #b04528;
        --primary-contrast: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181615;
          --fg: #f1efec;
          --muted: #a39d97;
          --card: #221f1d;
          --line: #3a3633;
          --primary: #ec7c58;
          --primary-contrast: #181615;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(env(safe-area-inset-top) + 24px) 24px
          calc(env(safe-area-inset-bottom) + 24px);
        background: var(--bg);
        color: var(--fg);
        font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 24rem;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 2rem 1.5rem;
      }
      img {
        width: 40px;
        height: 40px;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.015em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.55;
      }
      button {
        margin-top: 1.5rem;
        min-height: 44px;
        width: 100%;
        border: 0;
        border-radius: 0.625rem;
        background: var(--primary);
        color: var(--primary-contrast);
        font: inherit;
        font-weight: 600;
        font-size: 0.9375rem;
        cursor: pointer;
      }
      button:active {
        filter: brightness(0.95);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/favicon.svg" alt="" />
      <h1>You're offline</h1>
      <p>
        Polarch can't reach the network right now. Your saved work is safe —
        reconnect and try again.
      </p>
      <button type="button" onclick="location.replace('/')">Try again</button>
    </div>
    <script>
      addEventListener("online", () => location.replace("/"));
    </script>
  </body>
</html>

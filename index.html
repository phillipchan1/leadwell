<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Signed-out visitors to `/` go to the static landing without downloading
         the app bundle. Signed-in users, every other route, and OAuth callbacks
         load the app. Demo builds flip LEADWELL_DEMO via the Vite HTML plugin. */
      (function () {
        var LEADWELL_DEMO = false;
        function loadApp() {
          // LEADWELL_LOAD_APP
        }
        function isCallback(q, h) {
          return (
            /(?:^|[?&])(?:code|error|error_description)=/.test(q) ||
            /access_token|refresh_token/.test(h)
          );
        }
        function hasSession() {
          try {
            var raw = localStorage.getItem("lw-session");
            if (!raw) return false;
            var v = JSON.parse(raw);
            return Boolean(v && v.id);
          } catch (e) {}
          return false;
        }
        function setHop(v) {
          try { sessionStorage.setItem("lw-boot", v); } catch (e) {}
        }
        function clearHop() {
          try { sessionStorage.removeItem("lw-boot"); } catch (e) {}
        }
        function fromParam(q) {
          try {
            return new URLSearchParams(q.charAt(0) === "?" ? q.slice(1) : q).get("from") || "";
          } catch (e) { return ""; }
        }
        function stripFrom(q) {
          try {
            var p = new URLSearchParams(q.charAt(0) === "?" ? q.slice(1) : q);
            p.delete("from");
            var s = p.toString();
            return s ? "?" + s : "";
          } catch (e) { return q; }
        }
        function withFrom(q, value) {
          try {
            var p = new URLSearchParams(q.charAt(0) === "?" ? q.slice(1) : q);
            p.set("from", value);
            return "?" + p.toString();
          } catch (e) { return (q ? q + (q.indexOf("?") >= 0 ? "&" : "?") : "?") + "from=" + value; }
        }
        if (LEADWELL_DEMO) {
          loadApp();
          return;
        }
        var path = location.pathname.replace(/\/$/, "") || "/";
        var q = location.search;
        var h = location.hash;
        var cleanQ = stripFrom(q);
        if (path !== "/" || isCallback(cleanQ, h) || hasSession()) {
          if (fromParam(q)) history.replaceState(null, "", location.pathname + cleanQ + h);
          clearHop();
          loadApp();
          return;
        }
        /* No matching session. Show the landing. `from=root` / hop=root tell
           the landing boot not to send us back if a foreign-ref token is present. */
        setHop("root");
        location.replace("/landing/" + withFrom(cleanQ, "root") + h);
      })();
    </script>
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) on notched iPhones;
         interactive-widget makes the Android keyboard resize the layout
         instead of overlaying it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Polarch</title>
    <meta name="description" content="A quiet instrument for leading people well — at work, at church and at home." />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Matches the Android Chrome address bar and the iOS standalone status bar. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#F7F6F4"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#181615"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Polarch" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

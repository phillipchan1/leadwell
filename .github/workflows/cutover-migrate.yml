# Manual Supabase → Neon cutover. workflow_dispatch only — not a deploy.
# Source is a read-only Supabase session-pooler role (migration_reader).
# Auth rows are read only through migration_tmp.auth_users() /
# migration_tmp.auth_identities() — never by granting USAGE on auth.
# Secrets are masked and never printed. Do not set -x. Do not set
# LEADWELL_MIGRATE_TEST (that flag is prove/CI loopback only and would
# refuse the real source).
#
# This workflow produces NO artifact and NO step-summary or GITHUB_OUTPUT.
# Only counts and md5 hashes go to the job log. The verified dump backup
# lives in $RUNNER_TEMP, is checked with pg_restore --list + non-zero
# size (file name and byte size only), and is deleted in always().
name: cutover-migrate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Restore into the scratch Postgres container instead of Neon.
          Leave true unless you intend to write to NEON_DATABASE_URL.
        type: boolean
        default: true

concurrency:
  group: cutover-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - id: start-postgres
        name: Start scratch Postgres
        run: |
          set +x
          set -eu
          node scripts/scratch-postgres.mjs start

      - id: setup-node
        name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - id: npm-ci
        name: Install dependencies
        run: npm ci

      - id: container-log-guard
        name: Container log sentinel
        env:
          PGPASSWORD: postgres
        run: |
          set +x
          set -eu
          node scripts/prove-container-log.mjs

      - id: mask
        name: Mask secrets and prepare URLs
        env:
          # Empty on purpose: prove/CI sets this so both URLs must be
          # loopback. This job reads the real Supabase session pooler.
          LEADWELL_MIGRATE_TEST: ""
        run: |
          set +x
          set -eu
          unset PGHOST PGHOSTADDR PGSERVICE PGSERVICEFILE PGSYSCONFDIR
          node --input-type=module <<'JS'
          import { ensureSslMode, githubAddMaskLines } from "./scripts/loopback.mjs";

          function mask(value) {
            for (const line of githubAddMaskLines(value)) process.stdout.write(`${line}\n`);
          }

          const dryRun = process.env.DRY_RUN === "true";
          let source = (process.env.SOURCE_DATABASE_URL || "").trim();
          let neon = (process.env.NEON_DATABASE_URL || "").trim();
          mask(source);
          mask(neon);
          if (!source) {
            console.error("Missing repo secret SOURCE_DATABASE_URL");
            process.exit(1);
          }
          source = ensureSslMode(source);
          mask(source);
          let target;
          if (dryRun) {
            target = "postgresql://postgres:postgres@127.0.0.1:5432/leadwell_cutover";
          } else {
            if (!neon) {
              console.error("Missing repo secret NEON_DATABASE_URL (required when dry_run=false)");
              process.exit(1);
            }
            target = ensureSslMode(neon);
            mask(target);
          }
          if (source === target) {
            console.error("Source and target URLs must be different");
            process.exit(1);
          }
          const fs = await import("node:fs");
          const delim = `CUTOVER_${Date.now()}`;
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            [
              ["SOURCE_DATABASE_URL", source],
              ["SUPABASE_DB_URL", source],
              ["NEON_DB_URL", target],
              ["TARGET_DATABASE_URL", target],
            ]
              .map(([k, v]) => `${k}<<${delim}\n${v}\n${delim}\n`)
              .join(""),
          );
          console.log(`dry_run=${dryRun} target=${dryRun ? "scratch-postgres" : "neon"}`);
          JS

      - id: install-pg
        name: Install PostgreSQL clients
        run: |
          set +x
          set -eu
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-15 postgresql-client-16 postgresql-client-17

      - id: backup
        name: Verified dump backup
        env:
          PGOPTIONS: "-c default_transaction_read_only=on"
          # runner context is valid in step env, not job env.
          CUTOVER_DUMP_DIR: ${{ runner.temp }}/leadwell-cutover
        run: |
          set +x
          set -eu
          unset PGHOST PGHOSTADDR PGSERVICE PGSERVICEFILE PGSYSCONFDIR
          mkdir -p "$CUTOVER_DUMP_DIR"
          node --input-type=module <<'JS'
          import { spawnSync } from "node:child_process";
          import { existsSync, mkdirSync, statSync } from "node:fs";
          import { basename, join } from "node:path";
          import { sourceReadEnv } from "./scripts/loopback.mjs";
          import { PG_DUMP_PUBLIC_ARGS } from "./scripts/migrate-users.lib.mjs";
          import { installSafeErrorHandlers, run } from "./scripts/safe-cmd.mjs";

          installSafeErrorHandlers();
          const source = process.env.SOURCE_DATABASE_URL || "";
          const dumpDir = process.env.CUTOVER_DUMP_DIR || "";
          if (!dumpDir) throw new Error("CUTOVER_DUMP_DIR is required (runner temp, never artifacts)");
          function toolMajor(bin) {
            const res = spawnSync(bin, ["--version"], { encoding: "utf8" });
            if (res.status !== 0) return null;
            const m = `${res.stdout || ""}\n${res.stderr || ""}`.match(/(\d+)\./);
            return m ? Number(m[1]) : null;
          }
          function matchingBin(name, major) {
            const candidates = [
              process.env.PG_BIN ? join(process.env.PG_BIN, name) : null,
              `/usr/lib/postgresql/${major}/bin/${name}`,
              `/usr/pgsql-${major}/bin/${name}`,
              name,
            ].filter(Boolean);
            for (const bin of candidates) {
              if (bin !== name && !existsSync(bin)) continue;
              if (toolMajor(bin) === major) return bin;
            }
            return null;
          }
          const verOut = run("psql", [
            "-v",
            "ON_ERROR_STOP=1",
            "-tA",
            "-d",
            source,
            "-c",
            "SHOW server_version_num",
          ], { env: sourceReadEnv() });
          const n = Number(String(verOut).trim());
          if (!Number.isFinite(n) || n < 10000) throw new Error("unparsable server_version_num");
          const major = Math.floor(n / 10000);
          const dump = matchingBin("pg_dump", major);
          if (!dump) throw new Error(`pg_dump matching Postgres ${major} not found`);
          const restore = matchingBin("pg_restore", major);
          if (!restore) throw new Error(`pg_restore matching Postgres ${major} not found`);
          mkdirSync(dumpDir, { recursive: true });
          const file = join(dumpDir, "source.dump");
          run(dump, [...PG_DUMP_PUBLIC_ARGS, `--file=${file}`, source], { env: sourceReadEnv() });
          const bytes = statSync(file).size;
          if (!bytes) throw new Error("custom-format dump is empty");
          run(restore, ["--list", file], { env: process.env });
          console.log(`${basename(file)} ${bytes} bytes`);
          JS

      - id: scratch
        name: Create scratch target (dry_run)
        if: ${{ inputs.dry_run }}
        env:
          PGPASSWORD: postgres
        run: |
          set +x
          set -eu
          unset PGHOST PGHOSTADDR PGSERVICE PGSERVICEFILE PGSYSCONFDIR
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE leadwell_cutover;"

      - id: migrate
        name: Run Supabase → Neon migrate script
        env:
          LEADWELL_MIGRATE_TEST: ""
        run: |
          set +x
          set -eu
          unset PGHOST PGHOSTADDR PGSERVICE PGSERVICEFILE PGSYSCONFDIR
          unset LEADWELL_MIGRATE_TEST
          # dry_run=true: NEON_DB_URL is the scratch service DB (prepared above).
          # dry_run=false: NEON_DB_URL is NEON_DATABASE_URL. No --dry-run flag —
          # the script's --dry-run exits before restore, so we would have no
          # target to checksum or to confirm Phil's user.
          node scripts/migrate-supabase-to-neon.mjs

      - id: verify
        name: Checksums and Phil auth user
        env:
          LEADWELL_MIGRATE_TEST: ""
        run: |
          set +x
          set -eu
          unset PGHOST PGHOSTADDR PGSERVICE PGSERVICEFILE PGSYSCONFDIR
          unset LEADWELL_MIGRATE_TEST
          node scripts/cutover-verify.mjs

      - id: leftover-copy-role
        name: Drop leftover leadwell_copy
        if: ${{ always() }}
        run: |
          set +x
          set -eu
          node --input-type=module <<'JS'
          import { githubAddMaskLines } from "./scripts/loopback.mjs";
          import { disableTargetCopyRoleSql, TARGET_COPY_ROLE } from "./scripts/migrate-users.lib.mjs";
          import { installSafeErrorHandlers, run } from "./scripts/safe-cmd.mjs";

          installSafeErrorHandlers();
          const target = (process.env.TARGET_DATABASE_URL || process.env.NEON_DB_URL || "").trim();
          for (const line of githubAddMaskLines(target)) process.stdout.write(`${line}\n`);
          try {
            if (!target) {
              console.log("no");
              process.exit(0);
            }
            const n = String(
              run("psql", [
                "-v",
                "ON_ERROR_STOP=1",
                "-tA",
                "-d",
                target,
                "-c",
                `SELECT COUNT(*) FROM pg_roles WHERE rolname = '${TARGET_COPY_ROLE}'`,
              ]),
            ).trim();
            if (n === "0") {
              console.log("no");
              process.exit(0);
            }
            const owner = String(
              run("psql", ["-v", "ON_ERROR_STOP=1", "-tA", "-d", target, "-c", "SELECT current_user"]),
            ).trim();
            run("psql", ["-v", "ON_ERROR_STOP=1", "-d", target, "-c", disableTargetCopyRoleSql(owner)]);
            console.log("yes");
          } catch {
            console.log("unknown");
            process.exit(0);
          }
          JS

      - id: delete-dumps
        name: Delete dumps
        if: ${{ always() }}
        env:
          CUTOVER_DUMP_DIR: ${{ runner.temp }}/leadwell-cutover
        run: |
          set +x
          set -eu
          # Dumps and COPY CSVs stay on the runner only. Never upload them.
          rm -rf "${CUTOVER_DUMP_DIR:-${RUNNER_TEMP}/leadwell-cutover}"
          find "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}" -type f \( \
            -name '*.dump' -o \
            -name 'auth_users.csv' -o \
            -name 'auth_identities.csv' \
          \) -delete 2>/dev/null || true

      - id: stop-postgres
        name: Remove scratch Postgres
        if: ${{ always() }}
        run: |
          set +x
          node scripts/scratch-postgres.mjs stop >/dev/null 2>&1

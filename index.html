<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Signed-out visitors to `/` go to the static landing without downloading
         the app bundle. Signed-in users, every other route, and OAuth callbacks
         load the app. Demo builds flip LEADWELL_DEMO via the Vite HTML plugin. */
      (function () {
        var LEADWELL_DEMO = false;
        function loadApp() {
          // LEADWELL_LOAD_APP
        }
        function isCallback(q, h) {
          return (
            /(?:^|[?&])(?:code|error|error_description)=/.test(q) ||
            /access_token|refresh_token/.test(h)
          );
        }
        function hasSession() {
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (!k || k.indexOf("sb-") !== 0 || k.indexOf("-auth-token") === -1) continue;
              if (k.indexOf("code-verifier") !== -1) continue;
              var v = JSON.parse(localStorage.getItem(k) || "null");
              var token = v && (v.access_token || (v.currentSession && v.currentSession.access_token));
              if (token) return true;
            }
          } catch (e) {}
          return false;
        }
        if (LEADWELL_DEMO) {
          loadApp();
          return;
        }
        var path = location.pathname.replace(/\/$/, "") || "/";
        var q = location.search;
        var h = location.hash;
        if (path !== "/" || isCallback(q, h) || hasSession()) {
          loadApp();
          return;
        }
        location.replace("/landing/" + q + h);
      })();
    </script>
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) on notched iPhones;
         interactive-widget makes the Android keyboard resize the layout
         instead of overlaying it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>LeadWell</title>
    <meta name="description" content="A quiet instrument for leading people well — at work, at church and at home." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Matches the Android Chrome address bar and the iOS standalone status bar. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#013133"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#04191b"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="LeadWell" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Typecheck, lint, and the unit / prove scripts on every push and PR.
# Production deploy: the `deploy` job ships to the polarch Worker
# (`npm run cf:deploy`) only on a push to master in phillipchan1/leadwell,
# after `checks` passes. Never on pull_request or from forks.
# Secrets: CLOUDFLARE_API_TOKEN (scoped Workers deploy token), CLOUDFLARE_ACCOUNT_ID.
# Never upload pg_dump, CSV, or row-data artifacts from this workflow.
# scripts/guard-public-ci.mjs is a default-deny YAML hasher (nuvo PR #100):
# every step/job/workflow plus order must match the CODEOWNERS-protected
# allowlist. Cutover produces no artifact and no step-summary or output.
name: checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  # Never cancel a master run mid-deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: start-postgres
        name: Start scratch Postgres
        run: |
          set +x
          set -eu
          node scripts/scratch-postgres.mjs start
      - id: actionlint
        name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set +x
          set -eu
          mkdir -p "${RUNNER_TEMP}/actionlint-bin"
          curl -fsSL -o "${RUNNER_TEMP}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}/actionlint-bin" actionlint
          export PATH="${RUNNER_TEMP}/actionlint-bin:${PATH}"
          actionlint -color
      - id: setup-node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - id: npm-ci
        run: npm ci
      - id: guard
        name: Public-repo CI allowlist
        run: node scripts/guard-public-ci.mjs
      - id: typecheck
        name: Typecheck
        run: npm run typecheck
      - id: lint
        name: Lint
        run: npm run lint
      - id: test
        name: Worker + loopback + migrate (no live DB)
        run: npm test
      - id: install-pg
        name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - id: create-prove-dbs
        name: Create prove databases
        env:
          PGPASSWORD: postgres
        run: |
          set +x
          node --input-type=module <<'JS'
          import { githubAddMaskLines } from "./scripts/loopback.mjs";
          for (const key of ["PGPASSWORD"]) {
            for (const line of githubAddMaskLines(process.env[key] || "")) process.stdout.write(`${line}\n`);
          }
          JS
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE polarch_src;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE polarch_dst;"
      - id: container-log-guard
        name: Container log sentinel
        env:
          PGPASSWORD: postgres
        run: |
          set +x
          set -eu
          node scripts/prove-container-log.mjs
      - id: live-prove
        name: Live migrate prove (loopback only)
        env:
          POLARCH_PROVE_SOURCE_URL: postgresql://postgres:postgres@127.0.0.1:5432/polarch_src
          POLARCH_PROVE_TARGET_URL: postgresql://postgres:postgres@127.0.0.1:5432/polarch_dst
          PGPASSWORD: postgres
        run: |
          set +x
          set -eu
          node --input-type=module <<'JS'
          import { githubAddMaskLines } from "./scripts/loopback.mjs";
          for (const key of ["POLARCH_PROVE_SOURCE_URL", "POLARCH_PROVE_TARGET_URL", "PGPASSWORD"]) {
            for (const line of githubAddMaskLines(process.env[key] || "")) process.stdout.write(`${line}\n`);
          }
          JS
          npm run test:migrate
      - id: wrangler-preview
        name: Preview wrangler dry-run
        run: |
          mkdir -p dist
          test -f dist/index.html || printf '<!doctype html><title>polarch</title>\n' > dist/index.html
          npx wrangler deploy --env preview --dry-run
      - id: stop-postgres
        name: Remove scratch Postgres
        if: ${{ always() }}
        run: |
          set +x
          node scripts/scratch-postgres.mjs stop >/dev/null 2>&1

  deploy:
    needs: [checks]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'phillipchan1/leadwell' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: setup-node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - id: npm-ci
        run: npm ci --no-audit --no-fund
      - id: cf-deploy
        name: Deploy polarch Worker (npm run cf:deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +x
          set -eu
          npm run cf:deploy
